<html layout:decorate="~{common/skeleton}">

<body>
    <main class="row-container" style="padding: 0 10vw; gap: 15px;" layout:fragment="content">
        <h2>Account</h2>
        <div class="column-container"
            style="margin: 0 auto; gap: 20px; flex-direction: row-reverse; align-items: flex-start;">
            <input type="checkbox" class="buttonish-checkbox" id="edit" />
            <label class="buttonish-checkbox-label hidden-on-edit" for="edit">Edit</label>
            <label class="buttonish-checkbox-label shown-on-edit" for="edit">Cancel</label>
            <div class="row-container hidden-on-edit">
                <b>John Smith</b>
                <span>jsmith@example.org</span>
                <span>1600 Pennsylvania Avenue NW Washington, D.C. 20500 U.S.</span>
                <div class="column-container" style="margin-top: 10px;">
                    <a class="buttonish-link" style="color: white; background-color: #FF4D4D; font-weight: bold;"
                        th:href="@{/logout}"><span style="margin-right: 10px;">&#11013;</span>Log Out</a>
                </div>
            </div>
            <form class="row-container shown-on-edit" style="gap: 10px;">
                <div class="column-container">
                    <input name="firstname" type="text" placeholder="First Name" value="John" />
                    <input name="lastname" type="text" placeholder="Last Name" value="Smith" />
                </div>
                <input name="email" type="email" placeholder="E-mail" value="jsmith@example.org" />
                <input name="phonenumber" type="tel" placeholder="Phone Number" value="+15555555" />
                <input name="birthday" type="date" placeholder="Birthday" />
                <input type="submit" value="Save" style="padding: 5px;" />
            </form>
            <img href="" width="64px" height="64px" />
        </div>
    </main>
</body>

</html>
