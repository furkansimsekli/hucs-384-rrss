<html layout:decorate="~{common/skeleton}">

<body>
    <main class="row-container" layout:fragment="content">
        <h2 style="margin-left: 5vw;">Search Results...</h2>
        <ul>
            <li th:each="product : ${products}">
                <p th:text="${product.name}"></p>
                <p th:text="@{'$' + ${product.price}}"></p>
                <p th:text="@{'Review count: ' + ${product.reviews.size()}}"></p>
                <p th:text="@{'Created at: ' + ${product.createdAt}}"></p>
                <p th:text="@{'Average score: ' + ${product.getAverageScore()}}"></p>
            </li>
        </ul>
    </main>
</body>

</html>
