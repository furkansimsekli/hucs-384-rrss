<html layout:decorate="~{common/skeleton}">

<body>
    <main class="row-container" layout:fragment="content">
        <h2 style="margin-left: 5vw;">Featured Products</h2>
        <div id="index-carousel" style="gap: 1em;">
            <div th:each="product : ${trendingProducts}" id="carousel-item">
                <input type="radio" name="carousel" th:id="radio + ${productStat.index}" th:checked="${productStat.first}">
                <label th:for="radio + ${productStat.index}"
                    th:style="'background-image: url(' + ${product.images.size() > 0 ? product.images[0].imagePath : '/filler-product.png'} + ');'"></label>
                <a th:href="@{/products/{productId}(productId=${product.id})}"
                    th:style="'background-image: url(' + ${product.images.size() > 0 ? product.images[0].imagePath : '/filler-product.png'} + ');'"></a>
            </div>
        </div>

        <h2 style="margin-left: 5vw;">Latest Products</h2>
        <div th:if="${latestProducts}" class="column-container" style="gap: 20px; margin-left: 5vw; overflow-x: auto;">
            <div th:each="product : ${latestProducts}" class="list-cell row-container" style=" max-width: 80px; margin: 0;">
                <a th:href="@{/products/{productId}(productId=${product.id})}"
                    style="text-decoration: none; color: black; gap: 3px;">
                    <img th:unless="${product.images.size() > 0}" src="/filler-product.png"
                        style="max-width: 75px; max-height: 100px;"></img>
                    <img th:if="${product.images.size() > 0}" th:src="${product.images[0].imagePath}"
                        style="max-width: 75px; max-height: 100px;"></img>
                    <h3 th:text="${product.name}"
                        style="margin: 0px; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ">
                    </h3>
                    <div class="row-container" style="padding-top: 8px; margin-left: auto;" th:with="averageScore = ${product.getAverageScore()}">
                        <span style="color: var(--primary-color); font-size: 14;"
                            th:with="starCount = ${T(java.lang.Math).round(averageScore)}"
                            th:text="${#strings.repeat('&starf;', starCount != null ? starCount : 0)} + ${#strings.repeat('&star;', starCount != null ? 5 - starCount : 5)}" />
                        <span style="margin-right: auto; color: gray; font-size: 12;"
                            th:text="${product.getReviews().size()} + ' reviews'" />
                    </div>
                    <span th:text="@{'$' + ${product.getPrice()}}"></span>
                </a>
            </div>
        </div>
        <h2 style="margin-left: 5vw;">You Might Like</h2>
        <div th:if="${recommendations}" class="column-container" style="gap: 20px; margin-left: 5vw; overflow-x: auto;">
            <div th:each="product : ${recommendations}" class="list-cell row-container" style="max-width: 80px; margin: 0;">
                <a th:href="@{/products/{productId}(productId=${product.id})}"
                    style="text-decoration: none; color: black; gap: 3px;">
                    <img th:unless="${product.images.size() > 0}" src="/filler-product.png"
                        style="max-width: 75px; max-height: 100px;"></img>
                    <img th:if="${product.images.size() > 0}" th:src="${product.images[0].imagePath}"
                        style="max-width: 75px; max-height: 100px;"></img>
                    <h3 th:text="${product.name}"
                        style="margin: 0px; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ">
                    </h3>
                    <div class="row-container" style="padding-top: 8px; margin-left: auto;" th:with="averageScore = ${product.getAverageScore()}">
                        <span style="color: var(--primary-color); font-size: 14;"
                            th:with="starCount = ${T(java.lang.Math).round(averageScore)}"
                            th:text="${#strings.repeat('&starf;', starCount != null ? starCount : 0)} + ${#strings.repeat('&star;', starCount != null ? 5 - starCount : 5)}" />
                        <span style="margin-right: auto; color: gray; font-size: 12;"
                            th:text="${product.getReviews().size()} + ' reviews'" />
                    </div>
                    <span th:text="@{'$' + ${product.getPrice()}}"></span>
                </a>
            </div>
        </div>
    </main>
</body>

</html>
