<html layout:decorate="~{common/skeleton}">

<body>
    <main class="row-container" layout:fragment="content">
        <div class="slideshow column-container" style="max-height: 200px;">
            <img src="https://i.ytimg.com/vi/WgYaGPNRjgI/hq720.jpg" width="500px" id="slide1" />
            <img src="https://i.ytimg.com/vi/0saIBd-T2O8/hq720.jpg" width="500px" id="slide2" />
            <img src="https://i.ytimg.com/vi/BekKhIP0Jks/hqdefault.jpg" width="500px" id="slide3" />
        </div>
        <div class="column-container" style="margin: 10px auto;">
            <a href="#slide1"><input name="current-slide" type="radio" checked="" /></a>
            <a href="#slide2"><input name="current-slide" type="radio" checked="" /></a>
            <a href="#slide3"><input name="current-slide" type="radio" checked="" /></a>
        </div>
        <h2 style="margin-left: 5vw;">Latest Products</h2>
        <div th:if="${latestProducts}" class="column-container"
            style="gap: 20px; margin-left: 5vw; overflow-x: auto;">
            <div th:each="product : ${latestProducts}" class="list-cell row-container">
                <a th:href="@{/products/{productId}(productId=${product.id})}"
                    style="text-decoration: none; color: black; gap: 3px;">
                    <img th:unless="${product.images.size() > 0}" src="/filler-product.png"
                        style="max-width: 75px; max-height: 100px;"></img>
                    <img th:if="${product.images.size() > 0}" th:src="${product.images[0].imagePath}"
                        style="max-width: 75px; max-height: 100px;"></img>
                    <h3 th:text="${product.name}"
                        style="margin: 0px; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ">
                    </h3>
                    <span th:text="${product.getDescription()}"></span>
                    <span th:text="@{'$' + ${product.getPrice()}}"></span>
                </a>
            </div>
        </div>
        <h2 style="margin-left: 5vw;">You Might Like</h2>
        <!-- Change latestProducts to the recommendation list object for this section. -->
        <div th:if="${latestProducts}" class="column-container"
            style="gap: 20px; margin-left: 5vw; overflow-x: auto;">
            <div th:each="product : ${latestProducts}" class="list-cell row-container">
                <a th:href="@{/products/{productId}(productId=${product.id})}"
                    style="text-decoration: none; color: black; gap: 3px;">
                    <img th:unless="${product.images.size() > 0}" src="/filler-product.png"
                        style="max-width: 75px; max-height: 100px;"></img>
                    <img th:if="${product.images.size() > 0}" th:src="${product.images[0].imagePath}"
                        style="max-width: 75px; max-height: 100px;"></img>
                    <h3 th:text="${product.name}"
                        style="margin: 0px; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ">
                    </h3>
                    <span th:text="${product.getDescription()}"></span>
                    <span th:text="@{'$' + ${product.getPrice()}}"></span>
                </a>
            </div>
        </div>
    </main>
</body>

</html>
